name: Build Kernel CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'  # 00:00 WIB (UTC+7)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 8G
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime

jobs:
  build-kernel:
    name: "${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.hz.name }}-${{ matrix.hardened == 'on' && 'hardened' || 'standard' }}${{ matrix.bypasscharging == 'on' && '-bypasscharging' || '' }}${{ matrix.droidspaces == 'on' && '-droidspaces' || '' }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hz:
          - { id: 100, name: powersave }
          - { id: 250, name: balance }
          - { id: 500, name: performance }
          - { id: 1000, name: ultra-performance }
        variant: [stock, susfs]
        root: [none, resukisu]
        hardened: [off, on]
        bypasscharging: [off, on]
        droidspaces: [off, on]
        exclude:
          # Stock doesn't need a root solution
          - variant: stock
            root: resukisu
          # SUSFS requires a root solution
          - variant: susfs
            root: none

    steps:
      - name: Create Swap
        run: |
          SWAPFILE="/mnt/build_swapfile"
          while true; do
            if sudo fallocate -l 10G $SWAPFILE || sudo dd if=/dev/zero of=$SWAPFILE bs=1M count=10240 status=progress; then
              break
            else
              sleep 5
            fi
          done
          sudo chmod 600 $SWAPFILE && sudo mkswap $SWAPFILE && sudo swapon $SWAPFILE

      - uses: actions/checkout@v4
        with: { path: gki-clo }

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 clang lld llvm jq

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.hardened }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.hardened }}-
            ccache-${{ matrix.variant }}-${{ matrix.root }}-
            ccache-${{ matrix.variant }}-
            ccache-

      - name: Initialize ccache
        run: |
          ccache -z
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -o compiler_check=${{ env.CCACHE_COMPILERCHECK }}
          ccache -o sloppiness=${{ env.CCACHE_SLOPPINESS }}

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b main toolchains/clang

      - name: Setup AnyKernel3
        run: |
          cd gki-clo
          [ ! -d "anykernel" ] && git clone https://github.com/osm0sis/AnyKernel3.git anykernel || true

      - name: Build Kernel
        run: |
          # Wrap compiler with ccache
          export PATH="/usr/lib/ccache:$PATH"

          cd gki-clo
          chmod +x build.sh
          ./build.sh \
            hz=${{ matrix.hz.id }} \
            variant=${{ matrix.variant }} \
            root=${{ matrix.root }} \
            hardened=${{ matrix.hardened }} \
            bypasscharging=${{ matrix.bypasscharging }} \
            droidspaces=${{ matrix.droidspaces }} \
            lto=full

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Kono-Ha-${{ matrix.variant == 'stock' && format('{0}-{1}', matrix.variant, matrix.hz.name) || format('{0}-{1}-{2}', matrix.variant, matrix.root, matrix.hz.name) }}${{ matrix.hardened == 'on' && '-hardened' || '' }}${{ matrix.bypasscharging == 'on' && '-bypasscharging' || '' }}${{ matrix.droidspaces == 'on' && '-droidspaces' || '' }}"
          path: gki-clo/Kono-Ha-Release
          retention-days: 7

  release:
    needs: [build-kernel]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare assets
        run: |
          mkdir -p release_assets
          find artifacts -type f -name "*.zip" -exec mv {} release_assets/ \; || true
          find artifacts -type f -name "*.img" -exec mv {} release_assets/ \; || true

      - name: Generate Release Body
        run: |
          python3 -c "
          import os
          
          repo = os.environ['GITHUB_REPOSITORY']
          run_num = os.environ['GITHUB_RUN_NUMBER']
          sha = os.environ['GITHUB_SHA']
          base_url = f'https://github.com/{repo}/releases/download/build-{run_num}-{sha}'
          
          try:
              zips = [f for f in os.listdir('release_assets') if f.endswith('.zip')]
          except FileNotFoundError:
              zips = []
              
          def get_link(variant, root, hz, hardened, bypass, droidspaces):
              for f in zips:
                  fl = f.lower()
                  if variant not in fl: continue
                  if root == 'resukisu' and 'resukisu' not in fl: continue
                  if root == 'none' and 'resukisu' in fl: continue
                  
                  if hz == 'ultra-performance' and '-ultra-performance-' not in fl: continue
                  if hz == 'performance' and ('-performance-' not in fl or '-ultra-performance-' in fl): continue
                  if hz == 'powersave' and '-powersave-' not in fl: continue
                  if hz == 'balance' and '-balance-' not in fl: continue
                  
                  if hardened and '-hardened' not in fl: continue
                  if not hardened and '-hardened' in fl: continue
                  
                  if bypass and '-bypasscharging' not in fl: continue
                  if not bypass and '-bypasscharging' in fl: continue
                  
                  if droidspaces and '-droidspaces' not in fl: continue
                  if not droidspaces and '-droidspaces' in fl: continue
                  
                  label = '-'.join(filter(None, [variant, root if root != 'none' else '', hz, 'hardened' if hardened else '', 'bypass' if bypass else '', 'droidspaces' if droidspaces else '']))
                  return f'[{label}]({base_url}/{f})'
              return '❌ Failed'
              
          def gen_table(title, rows, is_bypass, is_droidspaces):
              out = [f'### {title}', '| Variant | Powersave | Balance | Performance | Ultra-Performance |', '|---|---|---|---|---|']
              for r_title, v, r, h in rows:
                  cols = [get_link(v, r, hz, h, is_bypass, is_droidspaces) for hz in ['powersave', 'balance', 'performance', 'ultra-performance']]
                  out.append(f'| **{r_title}** | ' + ' | '.join(cols) + ' |')
              return '\n'.join(out) + '\n\n' if len(out) > 3 else ''
              
          std = [
              ('Stock', 'stock', 'none', False),
              ('ReSukiSU', 'susfs', 'resukisu', False),
          ]
          hard = [
              ('Stock', 'stock', 'none', True),
              ('ReSukiSU', 'susfs', 'resukisu', True),
          ]
          
          with open('release_body.md', 'w') as f:
              f.write('Automated kernel build.\n')
              f.write(f'Commit: {sha}\n\n')
              f.write('> [!CAUTION]\n> **BACKUP your boot.img** before flashing to recover from potential bootloops or other issues.\n\n')
              f.write(gen_table('Standard Builds', std, False, False))
              f.write(gen_table('Hardened Builds', hard, False, False))
              
              f.write('---\n\n## ⚡ Bypass Charging Variants\n\n')
              f.write(gen_table('Standard ⚡', std, True, False))
              f.write(gen_table('Hardened ⚡', hard, True, False))

              f.write('---\n\n## 📱 Droidspaces Variants\n\n')
              f.write(gen_table('Standard 📱', std, False, True))
              f.write(gen_table('Hardened 📱', hard, False, True))

              f.write('---\n\n## ⚡📱 Bypass Charging + Droidspaces\n\n')
              f.write(gen_table('Standard ⚡📱', std, True, True))
              f.write(gen_table('Hardened ⚡📱', hard, True, True))
          "

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: Build ${{ github.sha }}
          body_path: release_body.md
          files: release_assets/*